version: '3.8'

services:
  # Master Redis node (Writes, Locks, Idempotency storage)
  redis-master:
    image: redis:7.2-alpine
    container_name: rentcar-redis-master
    command: redis-server --appendonly yes --protected-mode no
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    networks:
      - rentcar-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Read-Replica node (Read-heavy operations, idempotency cache verification)
  redis-replica:
    image: redis:7.2-alpine
    container_name: rentcar-redis-replica
    command: redis-server --replicaof redis-master 6379 --appendonly yes --protected-mode no
    ports:
      - "6380:6379"
    depends_on:
      redis-master:
        condition: service_healthy
    volumes:
      - redis_replica_data:/data
    networks:
      - rentcar-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Shard 2 node (Horizontal keyspace partitioning by VehicleId)
  redis-shard2:
    image: redis:7.2-alpine
    container_name: rentcar-redis-shard2
    command: redis-server --appendonly yes --protected-mode no
    ports:
      - "6381:6379"
    volumes:
      - redis_shard2_data:/data
    networks:
      - rentcar-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  rentcar-net:
    driver: bridge

volumes:
  redis_master_data:
  redis_replica_data:
  redis_shard2_data:
